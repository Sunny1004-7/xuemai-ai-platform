<!doctype html>
<html lang="zh-CN"><meta charset="UTF-8"><title>学脉开发与方法证据</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#f1f0e8;color:#203f3d;font-family:'Microsoft YaHei',sans-serif}main{width:100vw;height:100vh;padding:66px 100px;display:grid;grid-template-columns:310px 1fr;gap:76px}aside{border-right:1px solid #cdd8cf;display:flex;flex-direction:column;padding-right:42px}.brand{font-family:SimSun,serif;font-size:40px;font-weight:bold;letter-spacing:4px}.english{font-size:16px;letter-spacing:4px;margin-top:8px;color:#68827b}.chain{font-size:28px;line-height:1.7;margin-top:110px;color:#7e6554}.steps{margin-top:40px;display:grid;gap:23px}.steps span{color:#a5aaa1;font-size:20px}.steps span.active{color:#2e6a67;font-weight:bold}.date{margin-top:auto;font-size:18px;color:#6b7771;line-height:1.8}.stage{font-size:21px;letter-spacing:2px;color:#7e6554;margin:0 0 27px}h1{font-family:SimSun,serif;font-size:48px;line-height:1.4;margin:0 0 38px;font-weight:bold}.content{flex:1;min-height:0;overflow:hidden;position:relative;border-top:2px solid #2e6a67;border-bottom:1px solid #cdd8cf;padding:30px 0}.body:has(img){position:absolute;inset:20px 0;height:auto;line-height:0}.body{font-size:28px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}.body.code{font-family:Consolas,'Microsoft YaHei',monospace;font-size:22px;line-height:1.55;color:#29423f}.source{font-size:18px;line-height:1.7;color:#6c7771;margin-top:27px}.bar{height:3px;background:#d7e6db;margin-top:24px}.bar i{display:block;height:100%;background:#2e6a67;width:0}.enter{animation:enter .5s ease-out}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.card{display:flex;flex-direction:column;min-width:0}button{display:none}
</style>
<main><aside><div class="brand">学脉</div><div class="english">XUE MAI</div><div class="chain"></div><div class="steps"><span>需求与上下文</span><span>实际问题</span><span>代码实现</span><span>验证与结果</span></div><div class="date"></div></aside><section class="card"><p class="stage"></p><h1></h1><div class="content"><div class="body"></div></div><div class="source"></div><div class="bar"><i></i></div></section></main>
<script>
let boards=[];window.ready=fetch('boards.json').then(r=>r.json()).then(data=>boards=data)
window.show=async index=>{await window.ready;let b=boards[index];document.querySelector('.chain').textContent=b.chain;document.querySelector('.date').textContent=b.date;document.querySelector('.stage').textContent=b.stage;document.querySelector('h1').textContent=b.title;let body=document.querySelector('.body');body.textContent=b.text;if(index===1){let figure=document.createElement('img');figure.src='method-map.png';figure.style.cssText='width:100%;height:100%;object-fit:contain';body.textContent='';body.append(figure);}body.className='body'+(b.code?' code':'');document.querySelector('.source').textContent=b.source;let card=document.querySelector('.card');card.classList.remove('enter');void card.offsetHeight;card.classList.add('enter');let bar=document.querySelector('.bar i');bar.style.transition='none';bar.style.width='0';requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.transition=`width ${b.duration}s linear`;bar.style.width='100%'}));let step=Math.min(3,Math.floor(((index-3)%6)/1.5));document.querySelectorAll('.steps span').forEach((x,i)=>x.classList.toggle('active',i===step));if(index!==1 && body.scrollHeight>document.querySelector('.content').clientHeight-60){body.animate([{transform:'translateY(0)'},{transform:'translateY(0)',offset:.18},{transform:`translateY(-${body.scrollHeight-470}px)`}],{duration:b.duration*1000,fill:'forwards',easing:'linear'})}return b}
</script></html>
