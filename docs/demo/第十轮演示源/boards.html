<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>学脉演示与开发记录</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:'Microsoft YaHei',sans-serif;background:#f5f3ec;color:#203f3d}main{height:100%;padding:46px 90px 75px}.brand{font-family:SimSun,serif;font-size:30px;letter-spacing:2px}#stage{height:calc(100% - 45px);padding-top:35px}h1,h2,p{margin:0}h1{font-size:60px;font-weight:600;line-height:1.4}h2{font-size:38px;font-weight:500}p{font-size:32px;line-height:1.8}.cover,.outro{height:100%;display:flex;flex-direction:column;justify-content:center;gap:32px}.cover h1{font-family:SimSun,serif;font-size:100px}.author{font-size:28px;color:#725c49}.cover .purpose{max-width:1300px;font-size:42px}.rule{width:110px;height:5px;background:#2e6a67}.pain{display:flex;flex-direction:column;gap:42px;height:100%;justify-content:center}.pain-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px}.card{padding:38px 40px;border:1px solid #c9d4ca;border-radius:16px;background:#fffefb}.card p{margin-top:24px;font-size:32px;color:#52685f}.card:last-child{border-color:#d6c6b1;background:#f4eee3}.framework{position:relative;height:100%}.diagram-frame{height:calc(100% - 60px);position:relative;width:100%}.diagram-frame img{width:100%;height:100%;object-fit:contain}.focus{position:absolute;border:4px solid #2e6a67;pointer-events:none;border-radius:10px;opacity:0}.framework p{text-align:center;font-size:30px}.dev{height:100%;display:flex;flex-direction:column;gap:25px}.dev-head{display:flex;justify-content:space-between;align-items:end}.dev h1{font-size:46px}.date{font-size:26px;color:#725c49}.record{flex:1;min-height:0;background:#fffefb;border:1px solid #c8d5ca;border-radius:14px;padding:30px 42px;overflow:hidden}.record pre{font-family:'Microsoft YaHei',sans-serif;white-space:pre-wrap;word-break:break-word;font-size:30px;line-height:1.7;margin:0;height:100%;overflow:hidden}.record.code pre{font-family:Consolas,'Microsoft YaHei',monospace;font-size:28px;line-height:1.55}.source{font-size:24px;color:#52685f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.results{height:100%;display:flex;flex-direction:column;justify-content:center;gap:38px}.metrics{display:flex;gap:90px;padding:38px 0}.metric strong{display:block;font-family:'Times New Roman',serif;font-size:100px;color:#2e6a67}.metric p{font-size:32px}.results .note{font-size:28px;color:#53665d}.outro h1{font-family:SimSun,serif;font-size:72px}
</style><main><header class="brand">学脉 XueMai</header><div id="stage"></div></main>
<script type="module">
import { calculateFocus } from '../framework-focus.js';
let boards,facts,regions,summary;window.ready=Promise.all(['boards.json','product.json','../../figures/xuemai-framework-regions.json','../../experiments/round10/summary.json'].map(p=>fetch(p).then(r=>r.json()))).then(values=>{[boards,facts,regions,summary]=values});
const stage=document.querySelector('#stage');
window.show=async name=>{await window.ready;stage.innerHTML='';let view=document.createElement('div');stage.append(view);const author=`${facts.author.school} · ${facts.author.major} · ${facts.author.name}`;
if(name==='intro'){view.className='cover';view.innerHTML=`<div class="rule"></div><h1>学脉 XueMai</h1><p class="purpose">课程学习、个性化辅导与教学协作</p><p class="author">${author}</p>`;return {name,duration:14}}
if(name==='pain'){view.className='pain';view.innerHTML='<h1>让每次反馈都接得上下一步</h1><div class="pain-grid"><section class="card"><h2>学生知道答案以后</h2><p>找到困难，再决定先补什么。</p></section><section class="card"><h2>教师看到成绩以后</h2><p>理解不同困难，安排针对性活动。</p></section></div>';return {name,duration:16}}
if(name==='framework'){view.className='framework';view.innerHTML='<div class="diagram-frame"><img src="../../figures/xuemai-framework.png"><div class="focus"></div></div><p>课程证据连接个人学习与班级教学</p>';return {name,duration:24}}
if(name==='results'){view.className='results';view.innerHTML=`<h1>相同约束下，让学习安排更可执行</h1><div class="metrics"><div class="metric"><strong>${summary.local.path.evaluation_cases}</strong><p>预算与状态场景</p></div><div class="metric"><strong>0</strong><p>先修与预算违规</p></div><div class="metric"><strong>+${summary.path_mean_gain_percent.toFixed(2)}%</strong><p>平均计划效用</p></div></div><p class="note">180个独立图，与同约束可行贪心配对比较</p>`;return {name,duration:12}}
if(name==='outro'){view.className='outro';view.innerHTML=`<h1>让学习与教学相互连接</h1><p class="author">${author}</p><p>感谢各位评委老师的观看与指导</p>`;return {name,duration:12}}
let b=boards[Number(name)];view.className='dev';view.innerHTML='<div class="dev-head"><h1></h1><p class="date"></p></div><section class="record"><pre></pre></section><p class="source"></p>';view.querySelector('h1').textContent=b.title;view.querySelector('.date').textContent=b.date+' · 开发记录回放';const pre=view.querySelector('pre');pre.textContent=b.text;view.querySelector('.record').classList.toggle('code',!!b.code);view.querySelector('.source').textContent=b.source+' · 原文节选';return {...b,duration:7.5};
};
window.highlight=name=>{let frame=document.querySelector('.diagram-frame'),focus=document.querySelector('.focus');const viewport={width:frame.clientWidth,height:frame.clientHeight};const result=calculateFocus(regions,name,viewport);for(const [key,value] of Object.entries(result.box))focus.style[key]=value+'px';focus.style.borderColor=name==='teacher-methods'?'#7e6554':'#2e6a67';focus.style.opacity=1;focus.animate([{opacity:0},{opacity:1}],{duration:350});const box=result.box,zoom=Math.min(2.6,(viewport.width-70)/(box.width+45),(viewport.height-70)/(box.height+45));const x=viewport.width/2-(box.left+box.width/2)*zoom,y=viewport.height/2-(box.top+box.height/2)*zoom;frame.style.transformOrigin='0 0';frame.style.transition='transform .5s ease';frame.style.transform=`translate(${x}px,${y}px) scale(${zoom})`;return {name,...result,zoom,translation:{x,y},viewport};};
window.scrollRecord=()=>{const pre=document.querySelector('pre');if(pre){pre.style.overflow='auto';pre.scrollTo({top:pre.scrollHeight,behavior:'smooth'})}};
</script></html>
