name: 离线构建与师生闭环回归
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AI_MODE: mock
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装后端依赖
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements.txt
      - name: 验证业务与权限
        run: .venv/bin/python -m pytest backend/tests --ignore=backend/tests/test_security.py -q
      - name: 扫描已跟踪敏感信息
        run: .venv/bin/python scripts/check_secrets.py
      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci
      - name: 构建与浏览器回归
        working-directory: frontend
        run: |
          npm run test:algorithms
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: 保存失败验收证据
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 浏览器验收报告
          path: frontend/playwright-report/
